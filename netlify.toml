# Sistema Sonno — sito statico già compilato.
# Il repository contiene l'output pronto: Netlify non deve compilare nulla.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
